# PROJECT ----------------------------------------------------------------------
[project]
name = "cli-app"
version = "0.5.0"
description = "Add your description here"
authors = [
    { name = "Igor Lashkov", email = "rwrotson@yandex.ru" },
]
maintainers = []
keywords = [
    "template",
    "example",
    "typer",
    "structlog",
    "pydantic-settings",
    "uv",
    "pytest",
    "ruff",
    "mypy",
    "precommit",
    "properdocs",

]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.14",
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "platformdirs>=4.12.4",
    "pydantic-settings>=2.15.0",
    "rich>=15.0.0",
    "structlog>=26.1.0",
    "typer>=0.27.3",
]

[dependency-groups]
dev = [
    "commitizen>=4.19.2",
    "emojis>=0.7.0",
    "import-linter>=2.15",
    "mypy>=2.4.0",
    "poethepoet>=0.48.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-randomly>=5.0.0",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16.10",
]
docs = [
    "mkdocs-gen-files>=0.6.1",
    "mkdocs-literate-nav>=0.6.3",
    "mkdocs-material>=9.7.7",
    "mkdocs-minify-plugin>=0.8.0",
    "mkdocstrings[python]>=1.0.6",
    "properdocs>=1.6.7",
]

[project.scripts]
cli-app = "cli_app.main:main"



# BUILD BACKEND ----------------------------------------------------------------
[build-system]
requires = ["uv_build>=0.12.24,<0.13"]
build-backend = "uv_build"

[tool.uv]
# Security floors for transitive dependencies.
constraint-dependencies = ["urllib3>=2.8.0", "virtualenv>=21.7.13"]

[tool.uv.build-backend]
module-name = "cli_app"
module-root = "src"


# PYTEST -----------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --tb=short --strict-markers --strict-config -n auto"
xfail_strict = true
filterwarnings = ["error"]
timeout = 30

[tool.coverage.run]
source = ["cli_app"]
omit = ["*/__init__.py"]
branch = true
parallel = true
concurrency = ["multiprocessing"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 95


# MYPY -------------------------------------------------------------------------
[tool.mypy]
python_version = "3.14"
mypy_path = "src"
explicit_package_bases = true
files = ["src", "tests", "docs"]
exclude_gitignore = true
strict = true
disallow_any_unimported = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true


# RUFF -------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "ASYNC",
    "ANN",
    "S",
    "RUF",
    "TID",
    "C4",
    "SIM",
    "PT",
    "RET",
    "ARG",
    "PERF",
    "FURB",
    "PL",
    "DTZ",
    "T20",
    "ERA",
    "BLE",
    "N",
    "PIE",
    "D101",
    "D102",
    "D103",
    "PGH003",
    "PGH004",
    "T100",
    "C901",
    "FBT003",
    "A001",
    "A002",
    "A004",
    "A005",
    "A006",
    "G001",
    "G002",
    "G003",
    "G004",
    "G101",
    "G201",
    "G202",
    "LOG001",
    "LOG002",
    "LOG014",
    "LOG015"
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "PLR2004",
    "ARG",
    "S101",
    "S105",
    "S106",
    "D101",
    "D102",
    "D103"
]
"docs/**" = ["T20"]
# Package __init__ files re-export from sibling modules.
"src/**/__init__.py" = ["TID252"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.isort]
known-first-party = ["cli_app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"


# COMMITIZEN -------------------------------------------------------------------
[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_scheme = "pep440"
version_provider = "uv"
update_changelog_on_bump = true
major_version_zero = true


# IMPORT-LINTER ----------------------------------------------------------------
[tool.importlinter]
root_package = "cli_app"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Services stay independent of the CLI, configuration, and output"
type = "forbidden"
source_modules = ["cli_app.services"]
forbidden_modules = [
    "typer", "click", "rich", "structlog", "pydantic_settings", "platformdirs",
    "cli_app.cli", "cli_app.config", "cli_app.utils",
]

[[tool.importlinter.contracts]]
name = "Configuration has no application dependencies"
type = "forbidden"
source_modules = ["cli_app.config"]
forbidden_modules = ["typer", "rich", "cli_app.cli", "cli_app.services", "cli_app.utils"]

[[tool.importlinter.contracts]]
name = "Utilities do not depend on commands or use cases"
type = "forbidden"
source_modules = ["cli_app.utils"]
forbidden_modules = ["cli_app.cli", "cli_app.services"]


# POETHEPOET -------------------------------------------------------------------
[tool.poe.tasks]
fmt = "ruff format ."
fmt-check = "ruff format --check ."
lint = "ruff check ."
lint-imports = "lint-imports"
typecheck = "mypy"
test = "pytest --cov"
test-fast = "pytest"
docs = "properdocs serve"
check = ["fmt-check", "lint", "lint-imports", "typecheck", "test"]

[tool.poe.tasks.audit]
shell = """
uv export --quiet --format requirements-txt --all-groups --locked --no-emit-project --no-hashes --output-file requirements-audit.txt
uv run --locked --with pip-audit pip-audit --requirement requirements-audit.txt --no-deps
"""
